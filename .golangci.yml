run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - bodyclose
    - misspell
    - unconvert

linters-settings:
  errcheck:
    # Ignore tea.Cmd ignores returned from non-erroring helpers; report
    # the more common file/conn close misses.
    check-type-assertions: false

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
